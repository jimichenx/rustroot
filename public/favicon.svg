<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Rust Root · 截面 favicon
    与主 mark 同一几何。标签页有浅有深，整枚烤成锈橙，切开面挖空，
    缝隙露出标签页底色，不用 currentColor。
  -->
  <defs>
    <mask id="rr-fav">
      <rect width="64" height="64" fill="black"/>
      <rect x="5" y="5" width="54" height="54" rx="16" fill="white"/>
      <rect x="-24" y="30" width="112" height="14" fill="black" transform="rotate(-22 32 37)"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#e8590c" mask="url(#rr-fav)"/>
</svg>
