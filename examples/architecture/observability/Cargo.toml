[package]
name = "observability"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Chapter 17: Production Error Handling (thiserror / anyhow) and Structured Tracing"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
